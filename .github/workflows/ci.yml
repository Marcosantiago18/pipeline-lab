name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permiso mínimo por defecto; cada job solo amplía lo que necesita.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reutiliza la matriz de pruebas definida en tests.yml.
  test:
    name: Pruebas
    uses: ./.github/workflows/tests.yml

  # Análisis estático en PARALELO con las pruebas (no depende de `test`).
  lint:
    name: Análisis estático
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

  build:
    name: Compilación
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Guardar el resultado como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
