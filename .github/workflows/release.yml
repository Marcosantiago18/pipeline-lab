name: Release

on:
  push:
    tags:
      # Solo etiquetas con formato vX.Y.Z (p. ej. v1.0.0).
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  # Antes de publicar, reutiliza la misma matriz de pruebas.
  test:
    name: Pruebas
    uses: ./.github/workflows/tests.yml

  publish:
    name: Publicar release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Único permiso necesario: crear la Release y adjuntar el artefacto.
    permissions:
      contents: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular metadatos de compilación
        run: echo "VITE_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_ENV"

      - name: Compilar
        run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Comprimir dist en un .zip
        run: zip -r "pipeline-lab-${{ github.ref_name }}.zip" dist

      - name: Crear la Release de GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "pipeline-lab-${{ github.ref_name }}.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes
