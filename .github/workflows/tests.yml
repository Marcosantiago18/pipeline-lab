name: Pruebas

# Workflow reutilizable: contiene la ÚNICA definición de la matriz de pruebas.
# Se invoca desde ci.yml, pages.yml y release.yml mediante `uses`.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test
