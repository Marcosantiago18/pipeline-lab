name: Desplegar en Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permiso mínimo por defecto; cada job solo amplía lo que necesita.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Reutiliza la matriz de pruebas definida en tests.yml.
  test:
    name: Pruebas
    uses: ./.github/workflows/tests.yml

  build:
    name: Compilación
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Calcular metadatos de compilación
        run: echo "VITE_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_ENV"

      - name: Compilar con la ruta base del repositorio
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Subir el sitio como artefacto de Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Despliegue
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
